<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<meta name="theme-color" content="#4F46E5">
<title data-i18n="val_title">PlotLab – Geprüfte Rechnungen</title>
<style>
  @font-face { font-family:"Barlow"; font-weight:400; src:url(fonts/barlow-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Barlow"; font-weight:700; src:url(fonts/barlow-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family:"Source Sans 3"; font-weight:400; src:url(fonts/source-sans-3-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Source Sans 3"; font-weight:600; src:url(fonts/source-sans-3-latin-600-normal.woff2) format("woff2"); }
  :root { --brand:#4F46E5; --brand-dark:#3730A3; --brand-soft:#EEF0FF; --accent:#F97316; --paper:#F7F8FD; --ink:#1E2140; --muted:#565B7A; --line:#E2E5F3; --soft:#EEF0FA; --good:#127A3E; --good-bg:#E7F6EC; --bad:#B42318; --bad-bg:#FFF1F0; --r:16px; --shadow:0 1px 2px rgba(30,33,64,.06), 0 6px 20px rgba(79,70,229,.08); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); font:17px/27px "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1,h2,h3,.brand,.btn { font-family:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color:var(--brand); }
  header { background:#fff; border-bottom:1px solid var(--line); height:68px; display:flex; align-items:center; padding:0 24px; position:sticky; top:0; z-index:10; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:22px; color:var(--ink); text-decoration:none; }
  .brand img { width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid var(--brand-soft); }
  .lang { margin-left:auto; display:flex; gap:4px; background:var(--soft); padding:3px; border-radius:999px; }
  .lang button { font:700 14px/20px "Barlow", system-ui, sans-serif; background:transparent; color:var(--muted); border:0; border-radius:999px; padding:4px 14px; cursor:pointer; }
  .lang button[aria-pressed=true] { background:#fff; color:var(--brand); box-shadow:0 1px 3px rgba(30,33,64,.15); }
  main { flex:1; width:100%; max-width:1120px; margin:0 auto; padding:28px 24px 56px; }
  h1 { font-size:38px; line-height:1.12; font-weight:700; margin:0 0 12px; }
  h2 { font-size:24px; margin:40px 0 8px; }
  .lead { margin:0 0 20px; max-width:46em; font-size:18px; line-height:28px; color:var(--muted); }
  .btn { display:inline-block; background:var(--brand); color:#fff; border:2px solid var(--brand); padding:10px 22px; font-weight:700; font-size:17px; line-height:20px; border-radius:999px; cursor:pointer; }
  .btn:hover { background:var(--brand-dark); border-color:var(--brand-dark); }
  .btn:disabled { opacity:.6; cursor:progress; }
  .btn:focus-visible, .lang button:focus-visible, summary:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .status { margin:18px 0; padding:14px 18px; border-radius:var(--r); background:var(--soft); color:var(--muted); font-size:17px; }
  .status.ok { background:var(--good-bg); color:var(--good); border:2px solid var(--good); }
  .status.bad { background:var(--bad-bg); color:var(--bad); border:2px solid var(--bad); }
  .status strong { display:block; font:700 24px/1.3 "Barlow", system-ui, sans-serif; }
  .tablewrap { overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); }
  table { border-collapse:collapse; width:100%; font-size:16px; line-height:22px; }
  th, td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font:700 15px/20px "Barlow", system-ui, sans-serif; color:var(--muted); background:var(--paper); }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .res { font-weight:600; white-space:nowrap; }
  .res.ok { color:var(--good); } .res.bad { color:var(--bad); } .res.wait { color:var(--muted); font-weight:400; }
  .sub { color:var(--muted); font-size:14px; line-height:20px; }
  .code { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:14px; word-break:break-all; }
  details { margin-top:6px; }
  summary { cursor:pointer; color:var(--brand); font-size:14px; }
  .inner { margin-top:8px; background:var(--paper); border-radius:12px; padding:8px 10px; overflow-x:auto; }
  .inner table { font-size:14px; line-height:20px; }
  .inner th, .inner td { padding:4px 8px; }
  ul { padding-left:22px; } li { margin:6px 0; max-width:50em; }
  footer { color:var(--muted); text-align:center; padding:24px; font-size:15px; border-top:1px solid var(--line); background:#fff; }
  @media (max-width:768px) { header { height:60px; } header, footer { padding-left:12px; padding-right:12px; } main { padding:20px 12px 40px; } h1 { font-size:30px; } }
</style>
</head>
<body>
<header><a class="brand" href="./" data-i18n-title="val_back" title="Zur Startseite"><img src="logo.jpg" alt="" width="40" height="40">PlotLab</a><span class="lang" role="group" aria-label="Sprache / Language"><button id="lang_de" data-lang="de" aria-pressed="true">DE</button><button id="lang_en" data-lang="en" aria-pressed="false">EN</button></span></header>
<main>
  <h1 data-i18n="val_h1">Geprüfte Rechnungen</h1>
  <p class="lead" data-i18n="val_lead"></p>
  <button class="btn" id="run" type="button" data-i18n="val_run">Jetzt im Browser nachrechnen</button>
  <div class="status" id="status" role="status" aria-live="polite" data-i18n="val_idle"></div>
  <div class="tablewrap"><table>
    <thead><tr><th data-i18n="val_th_set">NIST-Datensatz</th><th data-i18n="val_th_what">Was geprüft wird</th><th class="n" data-i18n="val_th_n">Punkte</th><th class="n" data-i18n="val_th_val">Werte: richtige Stellen</th><th class="n" data-i18n="val_th_se">Fehler: richtige Stellen</th><th data-i18n="val_th_res">Ergebnis</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>

  <h2 data-i18n="val_how_h">So ist die Prüfung gemeint</h2>
  <ul><li data-i18n="val_how1"></li><li data-i18n="val_how2"></li><li data-i18n="val_how3"></li></ul>
  <h2 data-i18n="val_lim_h">Was diese Seite nicht beweist</h2>
  <ul><li data-i18n="val_lim1"></li><li data-i18n="val_lim2"></li></ul>
  <p class="sub" data-i18n="val_src"></p>
</main>
<footer data-i18n="foot">Unabhängiges Studierendenwerkzeug. Nicht mit der Universität verbunden.</footer>
<script src="i18n.js"></script>
<script src="pruefung.js"></script>
<script src="consent.js"></script>
</body>
</html>
