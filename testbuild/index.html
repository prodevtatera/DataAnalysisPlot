<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlotLab – Testaufbau</title>
<style>
  @font-face { font-family:"Barlow"; font-weight:400; src:url(fonts/barlow-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Barlow"; font-weight:700; src:url(fonts/barlow-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family:"Source Sans 3"; font-weight:400; src:url(fonts/source-sans-3-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Source Sans 3"; font-weight:600; src:url(fonts/source-sans-3-latin-600-normal.woff2) format("woff2"); }
  :root { --blue:#00376C; --paper:#FAFAF5; --line:#d9d9d0; --soft:#eeeee6; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); color:#000; font:17px/27px "Source Sans 3", system-ui, sans-serif; }
  h1,h2,.brand,.btn { font-family:"Barlow", system-ui, sans-serif; }
  header { background:var(--blue); color:var(--paper); height:81px; display:flex; align-items:center; padding:0 24px; }
  .brand { font-weight:700; font-size:23px; letter-spacing:.02em; }
  main { flex:1; width:100%; max-width:1120px; margin:0 auto; padding:24px 24px 48px; }
  h1 { font-size:36px; line-height:1.17; font-weight:400; margin:0 0 12px; }
  h2 { font-size:23px; font-weight:700; margin:28px 0 8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  textarea { width:100%; height:240px; font:15px/22px ui-monospace, Menlo, Consolas, monospace; padding:10px; border:2px solid var(--blue); border-radius:0; background:#fff; resize:vertical; }
  .btns { margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .btn { background:var(--blue); color:var(--paper); border:0; padding:10px 18px; font-weight:700; font-size:16px; border-radius:0; cursor:pointer; }
  .btn.alt { background:#fff; color:var(--blue); border:1px solid var(--blue); }
  .msg { margin-top:10px; padding:10px 14px; background:#fff; border-left:6px solid #B00020; }
  .msg[hidden] { display:none; }
  .scroll { overflow:auto; max-height:360px; background:#fff; border:1px solid var(--line); }
  table { border-collapse:collapse; width:100%; font-size:15px; line-height:22px; font-variant-numeric:tabular-nums; }
  th,td { text-align:right; padding:3px 10px; border-bottom:1px solid var(--soft); }
  th { background:var(--soft); position:sticky; top:0; font-weight:600; }
  #plot { background:#fff; border:1px solid var(--line); height:420px; }
  .empty { padding:24px 14px; color:#444; }
  .hint { font-size:15px; color:#333; }
  footer { background:var(--blue); color:var(--paper); padding:20px 24px; font-size:15px; }
  @media (max-width:768px) { .grid { grid-template-columns:1fr; } h1 { font-size:28px; } header,footer { padding-left:12px; padding-right:12px; } main { padding:16px 12px 40px; } }
</style>
</head>
<body>
<header><span class="brand">PlotLab</span></header>
<main>
  <h1>Daten einfügen</h1>
  <p class="hint">Aus Excel kopieren oder eine CSV-Datei laden. Dezimalkomma und Semikolon sind in Ordnung.</p>
  <div class="grid">
    <section>
      <h2>Eingabe</h2>
      <textarea id="in" aria-label="Daten" spellcheck="false" placeholder="x;y;sy&#10;1,0;2,1;0,2"></textarea>
      <div class="btns">
        <button class="btn" id="example">Beispiel laden</button>
        <label class="btn alt">Datei wählen<input id="file" type="file" accept=".csv,.txt,.tsv" hidden></label>
      </div>
      <div id="msg" class="msg" role="alert" hidden></div>
    </section>
    <section>
      <h2>Tabelle</h2>
      <div class="scroll" id="table"><div class="empty">Noch keine Daten.</div></div>
    </section>
  </div>
  <h2>Diagramm</h2>
  <div id="plot"><div class="empty">Noch keine Daten.</div></div>
</main>
<footer>Independent student tool. Not affiliated with Humboldt-Universität zu Berlin.</footer>
<script src="vendor/plotly.min.js"></script>
<script src="parse.js"></script>
<script>
const $ = id => document.getElementById(id);
const EXAMPLE = "t / s;U / V;sU / V\n1,0;2,1;0,2\n2,0;4,3;0,2\n3,0;6,2;0,3\n4,0;8,4;0,3\n5,0;9,9;0,4";
const fmt = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 10 });
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function render() {
  const r = parseTable($("in").value), msg = $("msg");
  msg.hidden = !r.error || !$("in").value.trim();
  if (r.error) {
    msg.textContent = r.error;
    $("table").innerHTML = '<div class="empty">Noch keine Daten.</div>';
    clearPlot();
    return;
  }
  $("table").innerHTML = "<table><thead><tr>" + r.header.map(h => `<th>${esc(h)}</th>`).join("") +
    "</tr></thead><tbody>" + r.rows.map(row => "<tr>" + row.map(v => `<td>${v === null ? "" : fmt.format(v)}</td>`).join("") + "</tr>").join("") + "</tbody></table>";
  drawPlot(r);
}
function clearPlot() { Plotly.purge("plot"); $("plot").innerHTML = '<div class="empty">Noch keine Daten.</div>'; }
// Column 1 = x, column 2 = y, column 3 (optional) = y error. Rows with an empty x or y are skipped.
function drawPlot(r) {
  if (r.header.length < 2) { clearPlot(); $("plot").innerHTML = '<div class="empty">Für ein Diagramm braucht es mindestens zwei Spalten (x und y).</div>'; return; }
  $("plot").querySelector(".empty")?.remove();
  const rows = r.rows.filter(w => w[0] !== null && w[1] !== null);
  const hasErr = r.header.length > 2;
  const f = { family: '"Source Sans 3", system-ui, sans-serif', size: 16, color: "#000" };
  const ax = t => ({ title: { text: t, standoff: 10 }, showline: true, linecolor: "#000", mirror: true, ticks: "outside", gridcolor: "#e4e4dc", zeroline: false, exponentformat: "none" });
  const trace = { x: rows.map(w => w[0]), y: rows.map(w => w[1]), mode: "markers", type: "scatter", name: "Messwerte",
    marker: { color: "#00376C", size: 9, symbol: "circle" } };
  if (hasErr) trace.error_y = { type: "data", array: rows.map(w => w[2] ?? 0), visible: true, color: "#00376C", thickness: 1.6, width: 5 };
  Plotly.newPlot("plot", [trace], { font: f, separators: ",.", margin: { l: 70, r: 20, t: 20, b: 60 },
    xaxis: ax(r.header[0]), yaxis: ax(r.header[1]), paper_bgcolor: "#fff", plot_bgcolor: "#fff",
    showlegend: true, legend: { x: 0.02, y: 0.98, bgcolor: "#fff", bordercolor: "#999", borderwidth: 1 } }, { displaylogo: false, responsive: true });
}
$("in").addEventListener("input", render);
$("example").onclick = () => { $("in").value = EXAMPLE; render(); };
$("file").onchange = async e => { const f = e.target.files[0]; if (f) { $("in").value = await f.text(); render(); } };
render();
</script>
</body>
</html>
